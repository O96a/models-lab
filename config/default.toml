# LLM Lab Configuration

[server]
host = "0.0.0.0"
port = 8080
log_level = "info"

[ollama]
base_url = "http://localhost:11434"
timeout_seconds = 120
default_model = "llama3.2"
default_embedding_model = "nomic-embed-text"

[database]
url = "postgres://llm:llm_secret@localhost:5432/llm_lab"
max_connections = 10

[redis]
url = "redis://localhost:6379"